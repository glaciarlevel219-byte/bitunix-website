<!DOCTYPE html>
<html>
<head>
    <title>Button Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b0e11;
            color: white;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            background: #161b22;
            color: white;
            border: 1px solid #30363d;
            cursor: pointer;
        }
        button:hover {
            background: #238636;
        }
        .page {
            display: none;
            padding: 20px;
            background: #161b22;
            border-radius: 8px;
            margin-top: 20px;
        }
        .page.active {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Simple Button Test</h1>
    
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('market')">Market</button>
    <button onclick="showPage('trade')">Trade</button>
    <button onclick="showPage('assets')">Assets</button>
    <button onclick="showPage('user')">User</button>
    
    <div id="homePage" class="page active">
        <h2>Home Page</h2>
        <p>Home page content here</p>
    </div>
    
    <div id="marketPage" class="page">
        <h2>Market Page</h2>
        <p>Market page content here</p>
    </div>
    
    <div id="tradePage" class="page">
        <h2>Trade Page</h2>
        <p>Trade page content here</p>
    </div>
    
    <div id="assetsPage" class="page">
        <h2>Assets Page</h2>
        <p>Assets page content here</p>
    </div>
    
    <div id="userPage" class="page">
        <h2>User Page</h2>
        <p>User page content here</p>
    </div>

    <script>
        function showPage(pageName) {
            console.log('Button clicked! Page:', pageName);
            
            // Hide all pages
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            
            // Show selected page
            const targetPage = document.getElementById(pageName + 'Page');
            if (targetPage) {
                targetPage.classList.add('active');
                console.log('Page activated:', pageName);
            } else {
                console.error('Page not found:', pageName);
            }
        }
        
        console.log('Simple test loaded');
    </script>
</body>
</html>
